# Local development and integration-test dependencies for the DapurPintar API.
# PostgreSQL is the system of record (M4-DEC-003 durable session authority);
# Redis is a non-authoritative cache.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dapurpintar
      POSTGRES_PASSWORD: dapurpintar
      POSTGRES_DB: dapurpintar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dapurpintar -d dapurpintar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
