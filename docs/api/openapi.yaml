        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: dp_session
      description: >
        HttpOnly, Secure, SameSite session cookie carrying the authenticated
        session. State-changing requests require the CSRF header approved in the
        final session transport policy.
  headers:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Client-supplied request identity for retry-sensitive POST commands.
        Scoped to the authenticated user and endpoint; retained at least 24 hours.
        Reusing a key with a different payload is a validation conflict.
      schema:
        type: string
        maxLength: 64
  parameters:
    cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor for stable pagination.
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      description: Page size. Default 20, server-enforced maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    itemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    recipeId:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    planId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    plannedMealId:
      name: plannedMealId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    listId:
      name: listId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    recommendationId:
      name: recommendationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    optionId:
      name: optionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Request malformed or violates contract-level validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, malformed, expired, or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Identity valid but outside authorized scope or account restricted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not available within the authorized scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with current aggregate or session state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Understandable but violates a domain validation or business rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Caller exceeded a documented usage or abuse limit.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: AI provider or internal dependency failure; core operations remain usable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RequestId:
      type: string
      description: Correlation identifier echoed in the X-Request-ID header.
    Page:
      type: object
      required: [has_more]
      properties:
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: User-safe explanation.
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              $ref: '#/components/schemas/RequestId'
    ErrorDetail:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    AccountStatus:
      type: string
      enum: [pending, active, restricted, closed]
    ProfileStatus:
      type: string
      enum: [created, incomplete, ready, updated]
    PantryItemStatus:
      type: string
      enum: [available, running_low, expiring_soon, consumed, removed]
    RecipeStatus:
      type: string
      enum: [available, revised, retired]
    MealPlanStatus:
      type: string
      enum: [draft, planned, in_progress, completed, cancelled, revised]
    PlannedMealStatus:
      type: string
      enum: [proposed, planned, revised, removed, completed]
    ShoppingListStatus:
      type: string
      enum: [draft, generated, reviewed, active, completed, cancelled, archived, revised]
    ShoppingItemStatus:
      type: string
      enum: [open, completed, removed]
    RecommendationStatus:
      type: string
      enum: [requested, created, presented, accepted, rejected, superseded, unable_to_complete]
    RegisterAccountRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        timezone:
          type: string
          default: Asia/Jakarta
    RegisterAccountResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AccountView'
        request_id:
          $ref: '#/components/schemas/RequestId'
    LoginAccountRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginAccountResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AccountView'
        request_id:
          $ref: '#/components/schemas/RequestId'
    RefreshAccountResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AccountView'
        request_id:
          $ref: '#/components/schemas/RequestId'
    AccountView:
      type: object
      required: [id, email, status, timezone, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/AccountStatus'
        timezone:
          type: string
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
    UserProfileView:
      type: object
      required: [id, account_id, display_name, status, timezone]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        display_name:
          type: string
        status:
          $ref: '#/components/schemas/ProfileStatus'
        timezone:
          type: string
        preferences:
          $ref: '#/components/schemas/PreferencesView'
        created_at:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        timezone:
          type: string
    PreferencesView:
      type: object
      properties:
        status:
          type: string
        preferences:
          type: object
        valid_from:
          type: string
          format: date
    UpdatePreferencesRequest:
      type: object
      properties:
        preferences:
          type: object
          description: Declared preferences and cooking constraints.
        valid_from:
          type: string
          format: date
    PantrySummaryView:
      type: object
      properties:
        data:
          type: object
          properties:
            total_items:
              type: integer
            expiring_soon_count:
              type: integer
            running_low_count:
              type: integer
        request_id:
          $ref: '#/components/schemas/RequestId'
    AddPantryItemRequest:
      type: object
      required: [ingredient_name, category, quantity]
      properties:
        ingredient_name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 100
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
          maxLength: 20
          default: unit
        expiry_date:
          type: string
          format: date
    UpdatePantryItemRequest:
      type: object
      properties:
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
          maxLength: 20
        category:
          type: string
          maxLength: 100
        expiry_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/PantryItemStatus'
    PantryItemView:
      type: object
      required: [id, ingredient_name, category, quantity, unit, status]
      properties:
        id:
          type: string
          format: uuid
        pantry_id:
          type: string
          format: uuid
        ingredient_name:
          type: string
        category:
          type: string
        quantity:
          type: number
        unit:
          type: string
        expiry_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/PantryItemStatus'
        created_at:
          type: string
          format: date-time
    RecipeSummaryView:
      type: object
      required: [id, title, summary, servings]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
        servings:
          type: integer
        prep_time_minutes:
          type: integer
          nullable: true
        cook_time_minutes:
          type: integer
          nullable: true
    RecipeDetailView:
      type: object
      required: [id, title, summary, servings, ingredients, instructions]
      properties:
        id:
          type: string
