openapi: 3.0.3
info:
  title: DapurPintar AI Public API
  description: >
    DapurPintar AI versioned REST API. All AI operations return decision support;
    the user remains the final decision-maker. Resource ownership follows the
    approved bounded contexts. Versioned under /api/v1.
  version: 1.0.0-mvp-draft
servers:
  - url: https://api.dapurpintar.ai/api/v1
    description: MVP production
  - url: https://localhost:8443/api/v1
    description: Local development
tags:
  - name: Accounts
    description: Identity and Access account participation.
  - name: User Profiles
    description: User Context and Preferences personal cooking context.
  - name: Pantry
    description: Pantry Management availability context.
  - name: Recipes
    description: Culinary Knowledge and Recipe Experience discovery.
  - name: Favorites
    description: Recipe preference expression.
  - name: Meal Plans
    description: Meal Planning daily and weekly intent.
  - name: Shopping Lists
    description: Shopping Optimization purchase intent.
  - name: Recommendations
    description: AI-Assisted Kitchen Decision Support.
  - name: AI
    description: AI-assisted decision support operations.
paths:
  /accounts:
    post:
      tags: [Accounts]
      summary: Register a new account.
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAccountRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /accounts/login:
    post:
      tags: [Accounts]
      summary: Begin authenticated account participation.
      operationId: loginAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginAccountRequest'
      responses:
        '200':
          description: Authenticated session established.
          headers:
            Set-Cookie:
              description: Session cookies for access and refresh credentials.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /accounts/refresh:
    post:
      tags: [Accounts]
      summary: Rotate a valid refresh session.
      operationId: refreshAccount
      description: >
        Requires a valid refresh-session credential. Rotates the session lineage
        and returns a new access session. Reuse of an invalidated credential is
        treated as suspected theft and revokes the lineage.
      responses:
        '200':
          description: New access session issued.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshAccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /accounts/logout:
    post:
      tags: [Accounts]
      summary: End current account participation.
      operationId: logoutAccount
      security:
        - sessionAuth: []
      responses:
        '204':
          description: Session revoked and browser credentials cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts/me:
    get:
      tags: [Accounts]
      summary: View current account participation context.
      operationId: getCurrentAccount
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Current participation context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /profile:
    get:
      tags: [User Profiles]
      summary: View the current user profile.
      operationId: getProfile
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileView'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [User Profiles]
      summary: Update personal profile information.
      operationId: updateProfile
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /profile/preferences:
    patch:
      tags: [User Profiles]
      summary: Change personal cooking preferences and constraints.
      operationId: updatePreferences
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: Updated preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /pantry:
    get:
      tags: [Pantry]
      summary: View current pantry summary and availability context.
      operationId: getPantrySummary
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Pantry summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantrySummaryView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /pantry/items:
    get:
      tags: [Pantry]
      summary: List pantry items with filtering and sorting.
      operationId: listPantryItems
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: category
          in: query
          description: Filter by pantry item category.
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PantryItemStatus'
        - name: sort
          in: query
          schema:
            type: string
            enum: [expiry_date, category, created_at]
            default: expiry_date
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Paginated pantry items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PantryItemView'
                  page:
                    $ref: '#/components/schemas/Page'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Pantry]
      summary: Add a pantry item.
      operationId: addPantryItem
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/headers/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPantryItemRequest'
      responses:
        '201':
          description: Pantry item added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryItemView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /pantry/items/{itemId}:
    get:
      tags: [Pantry]
      summary: View one pantry item.
      operationId: getPantryItem
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/itemId'
      responses:
        '200':
          description: Pantry item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryItemView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Pantry]
      summary: Adjust pantry item quantity, category, or expiry.
      operationId: updatePantryItem
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/itemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePantryItemRequest'
      responses:
        '200':
          description: Updated pantry item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryItemView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [Pantry]
      summary: Remove a pantry item from available context.
      operationId: removePantryItem
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/itemId'
      responses:
        '204':
          description: Pantry item removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /pantry/expiry:
    get:
      tags: [Pantry]
      summary: Review ingredients approaching expiry.
      operationId: listExpiringItems
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Expiring items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PantryItemView'
                  page:
                    $ref: '#/components/schemas/Page'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /recipes:
    get:
      tags: [Recipes]
      summary: Discover and search recipes.
      operationId: listRecipes
      description: >
        Public for general content. Personalized suitability remains an
        authenticated AI Recommendation capability.
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: q
          in: query
          description: Free-text search over title and summary.
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: max_prep_minutes
          in: query
          schema:
            type: integer
            minimum: 0
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, prep_time, title]
            default: relevance
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Paginated public recipes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecipeSummaryView'
                  page:
                    $ref: '#/components/schemas/Page'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
  /recipes/{recipeId}:
    get:
      tags: [Recipes]
      summary: View recipe detail and cooking guidance.
      operationId: getRecipe
      parameters:
        - $ref: '#/components/parameters/recipeId'
      responses:
        '200':
          description: Recipe detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetailView'
        '404':
          $ref: '#/components/responses/NotFound'
  /favorites:
    get:
      tags: [Favorites]
      summary: List current user's favorite recipes.
      operationId: listFavorites
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Paginated favorites.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FavoriteView'
                  page:
                    $ref: '#/components/schemas/Page'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /favorites/recipes/{recipeId}:
    put:
      tags: [Favorites]
      summary: Mark a recipe as favorited idempotently.
      operationId: favoriteRecipe
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/recipeId'
      responses:
        '204':
          description: Recipe favorited (idempotent).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Favorites]
      summary: Remove a recipe from favorites.
      operationId: unfavoriteRecipe
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/recipeId'
      responses:
        '204':
          description: Recipe removed from favorites (idempotent).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /meal-plans:
    get:
      tags: [Meal Plans]
      summary: List daily and weekly meal plans.
      operationId: listMealPlans
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Paginated meal plans.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MealPlanView'
                  page:
                    $ref: '#/components/schemas/Page'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Meal Plans]
      summary: Create a meal plan for a defined period.
      operationId: createMealPlan
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/headers/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMealPlanRequest'
      responses:
        '201':
          description: Meal plan created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /meal-plans/{planId}:
    get:
      tags: [Meal Plans]
      summary: View one meal plan.
      operationId: getMealPlan
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/planId'
      responses:
        '200':
          description: Meal plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Meal Plans]
      summary: Revise meal plan intent without lifecycle command.
      operationId: updateMealPlan
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/planId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMealPlanRequest'
      responses:
        '200':
          description: Updated meal plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /meal-plans/{planId}/cancel:
    post:
      tags: [Meal Plans]
      summary: Cancel a meal plan.
      operationId: cancelMealPlan
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/planId'
      responses:
        '200':
          description: Meal plan cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
  /meal-plans/{planId}/complete:
    post:
      tags: [Meal Plans]
      summary: Complete a meal plan.
      operationId: completeMealPlan
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/planId'
      responses:
        '200':
          description: Meal plan completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
  /meal-plans/{planId}/meals:
    get:
      tags: [Meal Plans]
      summary: List planned meals in a meal plan.
      operationId: listPlannedMeals
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/planId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Paginated planned meals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlannedMealView'
                  page:
                    $ref: '#/components/schemas/Page'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Meal Plans]
      summary: Plan a meal in a date or meal occasion.
      operationId: planMeal
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/planId'
        - $ref: '#/components/headers/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanMealRequest'
      responses:
        '201':
          description: Planned meal created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedMealView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '404':
          $ref: '#/components/responses/NotFound'
  /meal-plans/{planId}/meals/{plannedMealId}:
    patch:
      tags: [Meal Plans]
      summary: Change a planned meal.
      operationId: updatePlannedMeal
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/planId'
        - $ref: '#/components/parameters/plannedMealId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlannedMealRequest'
      responses:
        '200':
          description: Updated planned meal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedMealView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [Meal Plans]
      summary: Remove a planned meal.
      operationId: removePlannedMeal
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/planId'
        - $ref: '#/components/parameters/plannedMealId'
      responses:
        '204':
          description: Planned meal removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /shopping-lists:
    get:
      tags: [Shopping Lists]
      summary: List current user's shopping lists.
      operationId: listShoppingLists
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Paginated shopping lists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShoppingListView'
                  page:
                    $ref: '#/components/schemas/Page'
                  request_id:
                    $ref: '#/components/schemas/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Shopping Lists]
      summary: Create a shopping list.
      operationId: createShoppingList
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/headers/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShoppingListRequest'
      responses:
        '201':
          description: Shopping list created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /shopping-lists/generate:
    post:
      tags: [Shopping Lists]
      summary: Generate purchase intent from meal, pantry, or explicit context.
      operationId: generateShoppingList
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/headers/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateShoppingListRequest'
      responses:
        '201':
          description: Generated shopping list (Draft, reviewable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /shopping-lists/{listId}:
    get:
      tags: [Shopping Lists]
      summary: View one shopping list.
      operationId: getShoppingList
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/listId'
      responses:
        '200':
          description: Shopping list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Shopping Lists]
      summary: Revise shopping list details without lifecycle command.
      operationId: updateShoppingList
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/listId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShoppingListRequest'
      responses:
        '200':
          description: Updated shopping list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
